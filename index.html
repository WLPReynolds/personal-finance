<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personal Finance</title>
  <meta name="theme-color" content="#0f5c55">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- Google's sign-in script is loaded by the app only when Drive sync is on
       (or settings is opened, ready for "Connect") — see loadGoogleScript(). -->

</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <h1 class="brand">Personal Finance</h1>
      <div class="brand-version" id="brandVersion"></div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="syncChip" class="sync-chip" hidden></button>
      <button type="button" id="installBtn" class="btn-ghost" hidden>Install</button>
      <button type="button" id="viewBtn" class="btn-ghost" hidden>Grid</button>
      <button type="button" id="lockBtn" class="btn-ghost icon-btn" aria-label="Lock now" title="Lock now" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H9V7Zm3 7a2 2 0 0 1 1 3.73V19h-2v-1.27A2 2 0 0 1 12 14Z"/></svg>
      </button>
      <button type="button" id="settingsBtn" class="btn-ghost icon-btn" aria-label="Settings and backup">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.94-2.06-.02-2.88-2.22-.55a6.9 6.9 0 0 0-.66-1.6l1.18-1.96-2.04-2.04-1.96 1.18a6.9 6.9 0 0 0-1.6-.66L13.06 2.7h-2.88l-.55 2.23c-.56.15-1.1.37-1.6.66L6.07 4.4 4.03 6.44l1.18 1.96c-.29.5-.51 1.04-.66 1.6l-2.23.55v2.88l2.23.55c.15.56.37 1.1.66 1.6l-1.18 1.96 2.04 2.04 1.96-1.18c.5.29 1.04.51 1.6.66l.55 2.23h2.88l.55-2.23c.56-.15 1.1-.37 1.6-.66l1.96 1.18 2.04-2.04-1.18-1.96c.29-.5.51-1.04.66-1.6l2.23-.55Z"/></svg>
        <span class="dot" id="unexportedDot" hidden></span>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <button type="button" id="fab" class="fab" aria-label="Add entry" hidden>+</button>

  <dialog id="txDialog" class="sheet"></dialog>
  <dialog id="accountDialog" class="sheet"></dialog>
  <dialog id="settingsDialog" class="sheet sheet-tall"></dialog>
  <dialog id="conflictDialog" class="sheet sheet-tall"></dialog>
  <dialog id="recurringDialog" class="sheet sheet-tall"></dialog>
  <dialog id="recurringEditDialog" class="sheet"></dialog>
  <dialog id="reconcileDialog" class="sheet sheet-tall"></dialog>
  <dialog id="backupsDialog" class="sheet sheet-tall"></dialog>
  <dialog id="lockDialog" class="sheet"></dialog>
  <input type="file" id="importInput" hidden>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
